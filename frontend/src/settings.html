<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>设置 - 实时字幕翻译</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: #2b2b2b;
      color: #ffffff;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #4fc3f7;
    }

    .settings-section {
      background: #3c3c3c;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .settings-section h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #81d4fa;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #b0bec5;
    }

    .form-group select,
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="color"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #546e7a;
      border-radius: 4px;
      background: #455a64;
      color: #ffffff;
      font-size: 14px;
    }

    .form-group select:focus,
    .form-group input:focus {
      outline: none;
      border-color: #4fc3f7;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }

    .btn-primary {
      background: #4fc3f7;
      color: #000;
    }

    .btn-primary:hover {
      background: #29b6f6;
    }

    .btn-secondary {
      background: #546e7a;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #607d8b;
    }

    .actions {
      margin-top: 20px;
      text-align: right;
    }

    .preview-area {
      background: #1a1a1a;
      border-radius: 4px;
      padding: 20px;
      margin-top: 15px;
      text-align: center;
    }

    .preview-text {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <h1>实时字幕翻译 - 设置</h1>

  <!-- 音频设置 -->
  <div class="settings-section">
    <h2>音频设置</h2>
    <div class="form-group">
      <label for="audio-source">音频源</label>
      <select id="audio-source">
        <option value="">加载中...</option>
      </select>
    </div>
  </div>

  <!-- ASR 设置 -->
  <div class="settings-section">
    <h2>语音识别设置</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="whisper-model">Whisper 模型</label>
        <select id="whisper-model">
          <option value="tiny">tiny (最快)</option>
          <option value="base" selected>base (推荐)</option>
          <option value="small">small (较准)</option>
          <option value="medium">medium (准确)</option>
          <option value="large-v3">large-v3 (最准)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="compute-type">计算类型</label>
        <select id="compute-type">
          <option value="float16">float16 (GPU)</option>
          <option value="int8_float16">int8_float16 (GPU)</option>
          <option value="int8">int8 (CPU)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 翻译设置 -->
  <div class="settings-section">
    <h2>翻译设置</h2>
    <div class="form-group">
      <label for="target-languages">目标语言</label>
      <select id="target-languages" multiple>
        <option value="zh" selected>中文</option>
        <option value="en">英文</option>
        <option value="ja">日文</option>
        <option value="ko">韩文</option>
        <option value="fr">法文</option>
        <option value="de">德文</option>
        <option value="es">西班牙文</option>
      </select>
    </div>
  </div>

  <!-- 字幕样式设置 -->
  <div class="settings-section">
    <h2>字幕样式</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="font-family">字体</label>
        <select id="font-family">
          <option value="Microsoft YaHei">微软雅黑</option>
          <option value="SimHei">黑体</option>
          <option value="SimSun">宋体</option>
          <option value="KaiTi">楷体</option>
        </select>
      </div>
      <div class="form-group">
        <label for="font-size">字号</label>
        <input type="number" id="font-size" value="24" min="12" max="72">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="font-color">文字颜色</label>
        <input type="color" id="font-color" value="#FFFFFF">
      </div>
      <div class="form-group">
        <label for="stroke-color">描边颜色</label>
        <input type="color" id="stroke-color" value="#000000">
      </div>
      <div class="form-group">
        <label for="stroke-width">描边宽度</label>
        <input type="number" id="stroke-width" value="2" min="0" max="10">
      </div>
    </div>

    <!-- 预览区域 -->
    <div class="preview-area">
      <div class="preview-text" id="preview-text">
        今天天气真好啊
      </div>
    </div>
  </div>

  <!-- 快捷键设置 -->
  <div class="settings-section">
    <h2>快捷键</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="shortcut-pause">暂停/恢复</label>
        <input type="text" id="shortcut-pause" value="Ctrl+Shift+Space" readonly>
      </div>
      <div class="form-group">
        <label for="shortcut-language">切换语言</label>
        <input type="text" id="shortcut-language" value="Ctrl+Shift+L" readonly>
      </div>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="actions">
    <button class="btn btn-secondary" id="btn-cancel">取消</button>
    <button class="btn btn-primary" id="btn-save">保存设置</button>
  </div>

  <script>
    // 加载设置
    const settings = {
      audio: { source: '' },
      asr: { model: 'base', computeType: 'float16' },
      translation: { targetLanguages: ['zh', 'en'] },
      subtitle: {
        fontFamily: 'Microsoft YaHei',
        fontSize: 24,
        fontColor: '#FFFFFF',
        strokeColor: '#000000',
        strokeWidth: 2
      },
      shortcuts: {
        togglePause: 'Ctrl+Shift+Space',
        switchLanguage: 'Ctrl+Shift+L'
      }
    };

    // 更新预览
    function updatePreview() {
      const preview = document.getElementById('preview-text');
      const fontFamily = document.getElementById('font-family').value;
      const fontSize = document.getElementById('font-size').value;
      const fontColor = document.getElementById('font-color').value;
      const strokeColor = document.getElementById('stroke-color').value;
      const strokeWidth = document.getElementById('stroke-width').value;

      preview.style.fontFamily = fontFamily;
      preview.style.fontSize = `${fontSize}px`;
      preview.style.color = fontColor;
      preview.style.textShadow = `${strokeWidth}px ${strokeWidth}px 4px ${strokeColor}`;
    }

    // 保存设置
    document.getElementById('btn-save').addEventListener('click', () => {
      settings.asr.model = document.getElementById('whisper-model').value;
      settings.asr.computeType = document.getElementById('compute-type').value;
      settings.subtitle.fontFamily = document.getElementById('font-family').value;
      settings.subtitle.fontSize = parseInt(document.getElementById('font-size').value);
      settings.subtitle.fontColor = document.getElementById('font-color').value;
      settings.subtitle.strokeColor = document.getElementById('stroke-color').value;
      settings.subtitle.strokeWidth = parseInt(document.getElementById('stroke-width').value);

      // 发送到主进程保存
      // TODO: 实现 IPC 通信
      console.log('保存设置:', settings);
      window.close();
    });

    // 取消
    document.getElementById('btn-cancel').addEventListener('click', () => {
      window.close();
    });

    // 监听变化更新预览
    ['font-family', 'font-size', 'font-color', 'stroke-color', 'stroke-width'].forEach(id => {
      document.getElementById(id).addEventListener('change', updatePreview);
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    // 初始化预览
    updatePreview();
  </script>
</body>
</html>
