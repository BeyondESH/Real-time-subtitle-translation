# 实时字幕翻译软件配置文件
#
# 本文件仅承载【后端管线参数】。
# 前端偏好（字幕样式/窗口/快捷键/主题/开机自启等）由客户端 electron-store 管理，
# 不再从此文件读取（旧副本中的这些段会在客户端升级首启时一次性迁移导入）。

# 音频设置
audio:
  # 采样率 (Hz)
  sample_rate: 16000
  # 声道数 (1=单声道, 2=立体声)
  channels: 1
  # 音频块大小
  chunk_size: 1024
  # 音频源选择 (null=默认回环设备)
  source_app: null

# 管线设置
pipeline:
  # 环形缓冲区容量（秒）
  buffer_seconds: 30
  # 切句分析周期（毫秒）
  tick_ms: 250
  # 单条语句最大时长（秒），超过强制切分
  max_utterance_s: 15
  # 语句队列深度（满时丢最旧并告警）
  queue_size: 8

# VAD 设置 (faster-whisper 内置 Silero VAD)
vad:
  # 语音判定阈值 (0-1)
  threshold: 0.5
  # 句尾静音判定时长（毫秒），超过则切句
  min_silence_duration_ms: 600
  # 语句边界外扩（毫秒）
  speech_pad_ms: 200

# ASR 设置
asr:
  # Whisper 模型大小: tiny, base, small, medium, large-v3
  model_size: base
  # 设备: auto, cpu, cuda
  device: auto
  # 源语言 (null=自动检测, 或指定语言代码如 'ja', 'en', 'zh')
  language: null
  # 计算类型: float16, int8_float16, int8
  compute_type: float16

# 翻译设置
translation:
  # 日中专用模型
  primary_model: Helsinki-NLP/opus-mt-ja-zh
  # 全语种模型
  fallback_model: facebook/nllb-200-distilled-600M
  # 目标语言列表
  target_languages:
    - zh  # 中文
    - en  # 英文
  # 翻译设备: auto, cpu, cuda
  device: auto
  # NLLB 是否按需懒加载（首次用到才加载）
  lazy_load: true
  # 启动后是否后台预载日中主模型
  preload_primary: true

# WebSocket 设置
websocket:
  host: localhost
  port: 8765

