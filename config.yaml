# 实时字幕翻译软件配置文件
#
# 本文件仅承载【后端管线参数】。
# 前端偏好（字幕样式/窗口/快捷键/主题/开机自启等）由客户端 electron-store 管理，
# 不再从此文件读取（旧副本中的这些段会在客户端升级首启时一次性迁移导入）。

# 音频设置
audio:
  # 采样率 (Hz)
  sample_rate: 16000
  # 声道数 (1=单声道, 2=立体声)
  channels: 1
  # 音频块大小
  chunk_size: 512

# 管线设置
pipeline:
  # 环形缓冲区容量（秒）
  buffer_seconds: 30
  # 切句分析周期（毫秒）
  tick_ms: 125
  # 单条语句最大时长（秒），超过强制切分
  max_utterance_s: 15
  # 语句队列深度（满时丢最旧并告警）
  queue_size: 8
  # 管线停滞判定阈值（秒）：队列有待处理且超过该时长无处理进度时判停滞并自动恢复
  stall_timeout_s: 30

# VAD 设置 (faster-whisper 内置 Silero VAD)
vad:
  # 语音判定阈值 (0-1)
  threshold: 0.5
  # 句尾静音判定时长（毫秒），超过则切句
  min_silence_duration_ms: 400
  # 语句边界外扩（毫秒）
  speech_pad_ms: 200

# ASR 设置（Fun-ASR-Nano，sherpa-onnx 进程内常驻；单引擎模型，无档位）
asr:
  # 引擎模型标识（唯一合法值；非法值回退 funasr-nano 并告警）
  model: funasr-nano
  # 设备: auto, cpu, cuda（auto=检测到 CUDA provider 即用 GPU，失败静默降级 CPU）
  device: auto
  # 源语言（识别提示 + 翻译源语言）: ja / zh / en（引擎支持范围；非法值回退 ja）
  language: ja
  # 逆文本规范化（数字/日期等口语形式 → 书面形式）
  itn: true
  # 热词（逗号分隔，提升专有名词识别；空=不启用）
  hotwords: ''
  # 解码线程数
  num_threads: 2

# 翻译设置（llama.cpp / llama-server sidecar）
translation:
  # 默认翻译模型（随包注册表 id；首次使用时自动下载，进度经 model_progress 广播）
  default_model: hy-mt2-1.8b-q4km
  # 可选：注册表增补条目（同构：id/display_name/repo/revision/filename/size_bytes/sha256/license/profile）
  models: []
  # 模型下载源: auto（官方→镜像→ModelScope 自动切换）, huggingface, hf-mirror, modelscope
  download:
    source: auto
  # 上下文长度（llama-server -c）
  n_ctx: 4096
  # 单次翻译请求超时（秒）
  timeout_s: 30
  # 流式输出（SSE 渐进上屏，首字时延更低）；false=回退整段模式（零行为差异）
  stream: true
  # 目标语言列表
  target_languages:
    - zh  # 中文
    - en  # 英文
  # 翻译设备: auto, cpu, cuda（auto=检测到 CUDA 即用 GPU，拉起失败静默降级 CPU）
  device: auto

# WebSocket 设置
websocket:
  host: localhost
  port: 8765

